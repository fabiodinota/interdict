{{- if and (not .Values.certInit.enabled) (not .Values.existingTlsSecret) }}
# Template for operator-provided TLS certificates.
# When certInit.enabled=false and no existingTlsSecret is set,
# the operator must create this Secret manually before installing the chart.
#
# Example:
#   kubectl create secret generic <release>-interdict-tls \
#     --from-file=internal-ca.pem=./certs/internal-ca.pem \
#     --from-file=control-plane.pem=./certs/control-plane.pem \
#     --from-file=control-plane-key.pem=./certs/control-plane-key.pem \
#     --from-file=evidence-collector.pem=./certs/evidence-collector.pem \
#     --from-file=evidence-collector-key.pem=./certs/evidence-collector-key.pem \
#     --from-file=kernel-client.pem=./certs/kernel-client.pem \
#     --from-file=kernel-client-key.pem=./certs/kernel-client-key.pem
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "interdict.fullname" . }}-tls
  labels:
    {{- include "interdict.labels" . | nindent 4 }}
    app.kubernetes.io/component: tls
type: Opaque
data: {}
# Populate this Secret with base64-encoded certificate files before deployment.
{{- end }}
