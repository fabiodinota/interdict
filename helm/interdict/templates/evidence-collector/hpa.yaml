{{- if .Values.evidenceCollector.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "interdict.fullname" . }}-evidence-collector
  labels:
    {{- include "interdict.labels" . | nindent 4 }}
    app.kubernetes.io/component: evidence-collector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "interdict.fullname" . }}-evidence-collector
  minReplicas: {{ .Values.evidenceCollector.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.evidenceCollector.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.evidenceCollector.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
