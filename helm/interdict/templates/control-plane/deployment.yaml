{{- include "interdict.validateRequired" (dict "name" "postgresql.auth.password" "value" .Values.postgresql.auth.password "existingSecret" .Values.postgresql.auth.existingSecret) -}}
{{- include "interdict.validateRequired" (dict "name" "minio.auth.rootPassword" "value" .Values.minio.auth.rootPassword "existingSecret" .Values.minio.auth.existingSecret) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "interdict.fullname" . }}-control-plane
  labels:
    {{- include "interdict.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      {{- include "interdict.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "interdict.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      {{- include "interdict.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "interdict.serviceAccountName" . }}
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-postgres
          image: busybox:1.36@sha256:b9598f8c98e24d0ad42c1742c32516772c3aa2151011ebaf639089bd18c605b8
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until wget --spider -q http://{{ .Release.Name }}-postgresql:5432 2>/dev/null || nc -z {{ .Release.Name }}-postgresql 5432; do
                echo "PostgreSQL not ready, retrying in 3s..."
                sleep 3
              done
              echo "PostgreSQL is ready."
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      containers:
        - name: control-plane
          image: {{ include "interdict.image" (dict "service" .Values.controlPlane "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.controlPlane.grpcPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "interdict.fullname" . }}-control-plane
          env:
            - name: POSTGRES_PASSWORD
              {{- if .Values.postgresql.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey | default "password" }}
              {{- else }}
              value: {{ .Values.postgresql.auth.password | quote }}
              {{- end }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: signing-keys
              mountPath: /data/keys
            {{- if .Values.controlPlane.saml.enabled }}
            - name: saml-config
              mountPath: /config
              readOnly: true
            {{- end }}
      volumes:
        - name: certs
          {{- if .Values.certInit.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "interdict.fullname" . }}-certs
          {{- else if .Values.existingTlsSecret }}
          secret:
            secretName: {{ .Values.existingTlsSecret }}
          {{- else }}
          secret:
            secretName: {{ include "interdict.fullname" . }}-tls
          {{- end }}
        - name: signing-keys
          persistentVolumeClaim:
            claimName: {{ include "interdict.fullname" . }}-signing-keys
        {{- if .Values.controlPlane.saml.enabled }}
        - name: saml-config
          {{- if .Values.controlPlane.saml.existingIdpMetadataSecret }}
          secret:
            secretName: {{ .Values.controlPlane.saml.existingIdpMetadataSecret }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
