{{- if .Values.dashboard.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "interdict.fullname" . }}-dashboard
  labels:
    {{- include "interdict.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  podSelector:
    matchLabels:
      {{- include "interdict.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # HTTP from ingress controller or external
    - ports:
        - port: {{ .Values.dashboard.port }}
          protocol: TCP
  egress:
    # Control plane API (BFF proxy)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: control-plane
      ports:
        - port: {{ .Values.controlPlane.port }}
          protocol: TCP
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
