apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "interdict.fullname" . }}-dashboard
  labels:
    {{- include "interdict.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "interdict.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "interdict.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      {{- include "interdict.imagePullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-control-plane
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Control Plane..."
              until wget --spider -q http://{{ include "interdict.fullname" . }}-control-plane:{{ .Values.controlPlane.port }}/health 2>/dev/null; do
                echo "Control Plane not ready, retrying in 3s..."
                sleep 3
              done
              echo "Control Plane is ready."
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      containers:
        - name: dashboard
          image: {{ include "interdict.image" (dict "service" .Values.dashboard "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
          env:
            - name: CONTROL_PLANE_URL
              value: "http://{{ include "interdict.fullname" . }}-control-plane:{{ .Values.controlPlane.port }}"
            - name: NODE_ENV
              value: {{ .Values.dashboard.nodeEnv | quote }}
            {{- if .Values.dashboard.saml.enabled }}
            - name: NEXT_PUBLIC_SAML_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.dashboard.saml.apiUrl }}
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.dashboard.saml.apiUrl | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
