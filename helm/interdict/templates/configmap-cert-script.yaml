{{- if .Values.certInit.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "interdict.fullname" . }}-cert-script
  labels:
    {{- include "interdict.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  generate-internal-ca.sh: |
    #!/bin/sh
    set -e

    CERT_DIR="${CERT_DIR:-/certs}"

    if [ -f "${CERT_DIR}/internal-ca.pem" ]; then
        echo "[cert-init] Certificates already exist at ${CERT_DIR}/internal-ca.pem, skipping generation."
        exit 0
    fi

    echo "[cert-init] Generating internal CA and service certificates..."

    # Internal CA (10-year validity, ECDSA P-256)
    openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
        -keyout "${CERT_DIR}/internal-ca-key.pem" \
        -out "${CERT_DIR}/internal-ca.pem" \
        -days 3650 -nodes \
        -subj "/CN=interdict-internal-ca/O=Interdict"

    echo "[cert-init] Internal CA generated."

    generate_service_cert() {
        name="$1"
        san="$2"

        cat > "/tmp/${name}-ext.cnf" <<EXTEOF
    [v3_ext]
    subjectAltName=${san}
    basicConstraints=CA:FALSE
    keyUsage=digitalSignature,keyEncipherment
    extendedKeyUsage=serverAuth,clientAuth
    EXTEOF

        openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
            -keyout "${CERT_DIR}/${name}-key.pem" \
            -out "/tmp/${name}.csr" \
            -nodes \
            -subj "/CN=${name}/O=Interdict"

        openssl x509 -req \
            -in "/tmp/${name}.csr" \
            -CA "${CERT_DIR}/internal-ca.pem" \
            -CAkey "${CERT_DIR}/internal-ca-key.pem" \
            -CAcreateserial \
            -out "${CERT_DIR}/${name}.pem" \
            -days 365 \
            -extensions v3_ext \
            -extfile "/tmp/${name}-ext.cnf"

        rm -f "/tmp/${name}.csr" "/tmp/${name}-ext.cnf"
        echo "[cert-init] Certificate generated for ${name}."
    }

    generate_service_cert "evidence-collector" "DNS:evidence-collector,DNS:{{ include "interdict.fullname" . }}-evidence-collector,DNS:localhost"
    generate_service_cert "control-plane" "DNS:control-plane,DNS:{{ include "interdict.fullname" . }}-control-plane,DNS:localhost"
    generate_service_cert "kernel-client" "DNS:kernel,DNS:{{ include "interdict.fullname" . }}-kernel,DNS:localhost"

    chmod 644 "${CERT_DIR}"/*.pem
    chmod 600 "${CERT_DIR}"/*-key.pem

    echo "[cert-init] All certificates generated successfully."
    ls -la "${CERT_DIR}/"
{{- end }}
