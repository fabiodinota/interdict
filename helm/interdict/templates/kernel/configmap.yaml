apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "interdict.fullname" . }}-kernel
  labels:
    {{- include "interdict.labels" . | nindent 4 }}
    app.kubernetes.io/component: kernel
data:
  KERNEL_LISTEN_ADDR: {{ .Values.kernel.listenAddr | quote }}
  KERNEL_CA_CERT_PATH: {{ .Values.kernel.caCertPath | quote }}
  KERNEL_CA_KEY_PATH: {{ .Values.kernel.caKeyPath | quote }}
  KERNEL_DISTRIBUTION_ADDR: "https://{{ include "interdict.fullname" . }}-control-plane:{{ .Values.controlPlane.grpcPort }}"
  KERNEL_DISTRIBUTION_TLS_SERVER_NAME: {{ default (printf "%s-control-plane" (include "interdict.fullname" .)) .Values.kernel.distributionTlsServerName | quote }}
  KERNEL_EVIDENCE_COLLECTOR_ADDR: "https://{{ include "interdict.fullname" . }}-evidence-collector:{{ .Values.evidenceCollector.grpcPort }}"
  KERNEL_ORG_ID: {{ .Values.kernel.orgId | quote }}
  KERNEL_LOG_LEVEL: {{ .Values.kernel.logLevel | quote }}
  KERNEL_LOG_FORMAT: {{ .Values.kernel.logFormat | quote }}
  KERNEL_ALLOWLIST_VENDORS: {{ .Values.kernel.allowlistVendors | quote }}
  KERNEL_FORCE_TEMPLATE: {{ .Values.kernel.forceTemplate | quote }}
  KERNEL_CONNECT_TIMEOUT_MS: {{ .Values.kernel.connectTimeoutMs | quote }}
  KERNEL_FIRST_BYTE_TIMEOUT_MS: {{ .Values.kernel.firstByteTimeoutMs | quote }}
  KERNEL_STREAM_TIMEOUT_MS: {{ .Values.kernel.streamTimeoutMs | quote }}
  KERNEL_MAX_REQUEST_QUEUE: {{ .Values.kernel.maxRequestQueue | quote }}
  KERNEL_POOL_MAX_CONNECTIONS: {{ .Values.kernel.poolMaxConnections | quote }}
  KERNEL_POOL_MAX_STREAMS: {{ .Values.kernel.poolMaxStreams | quote }}
  KERNEL_POOL_IDLE_TIMEOUT: {{ .Values.kernel.poolIdleTimeout | quote }}
  KERNEL_MTLS_CA_CERT: {{ .Values.kernel.mtls.caCertPath | quote }}
  KERNEL_MTLS_CLIENT_CERT: {{ .Values.kernel.mtls.clientCertPath | quote }}
  KERNEL_MTLS_CLIENT_KEY: {{ .Values.kernel.mtls.clientKeyPath | quote }}
  RUST_LOG: {{ .Values.kernel.rustLog | quote }}
