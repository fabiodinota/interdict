{{- if .Values.certInit.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "interdict.fullname" . }}-certs
  labels:
    {{- include "interdict.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.certsPvcSize | default "10Mi" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "interdict.fullname" . }}-cert-init
  labels:
    {{- include "interdict.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "interdict.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cert-init
    spec:
      restartPolicy: Never
      {{- include "interdict.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: cert-init
          image: {{ include "interdict.image" (dict "service" .Values.certInit "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ .Values.certInit.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - "apk add --no-cache openssl && sh /scripts/generate-internal-ca.sh"
          volumeMounts:
            - name: cert-script
              mountPath: /scripts
              readOnly: true
            - name: certs
              mountPath: /certs
          resources:
            {{- toYaml .Values.certInit.resources | nindent 12 }}
      volumes:
        - name: cert-script
          configMap:
            name: {{ include "interdict.fullname" . }}-cert-script
        - name: certs
          persistentVolumeClaim:
            claimName: {{ include "interdict.fullname" . }}-certs
{{- end }}
