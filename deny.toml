# cargo-deny configuration for Interdict
# https://embarkstudios.github.io/cargo-deny/

# ---------------------------------------------------------------------------
# Graph
# ---------------------------------------------------------------------------
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

# ---------------------------------------------------------------------------
# Advisories — RustSec vulnerability database
# ---------------------------------------------------------------------------
[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436) — transitive via clickhouse → higher-kinded-types.
    # No action available from our workspace; clickhouse upstream must migrate.
    "RUSTSEC-2024-0436",
]

# ---------------------------------------------------------------------------
# Licenses — SPDX allowlist
# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.93
unused-allowed-license = "warn"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "ISC",
    "OpenSSL",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "MIT-0",
    "MPL-2.0",
]

# Workspace crates use LicenseRef-Proprietary (not published, not open-source)
[licenses.private]
ignore = true
registries = []

# Per-crate exceptions for uncommon but acceptable licenses
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-roots"

[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "kernel"

[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "evidence-collector"

[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "interdict-verify"

# ---------------------------------------------------------------------------
# Bans — duplicate detection and prohibited crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Prefer rustls over openssl
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

# Known transitive duplicates that are not actionable from our workspace.
# rand 0.8 is a transitive dep via tract-onnx-opl and rand_distr (from tract-onnx 0.22).
# All workspace crates use rand 0.9 or rand_core 0.6 directly. Will resolve when
# tract-onnx 0.23+ releases a stable version.
skip = [
    { crate = "rand@0.8.5", reason = "transitive via tract-onnx; no stable upgrade path" },
]
skip-tree = [
    # windows-sys bumps frequently; transitive deps lag behind
    { crate = "windows-sys@0.52.0", reason = "foundational crate that bumps too frequently for ecosystem alignment" },
]

# ---------------------------------------------------------------------------
# Sources — restrict dependency origins
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
