[package]
name = "interdict-verify"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "interdict_verify"
path = "src/lib.rs"

[[bin]]
name = "interdict-verify"
path = "src/main.rs"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde"] }
rand = "0.8"
rs_merkle = "1.5"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
