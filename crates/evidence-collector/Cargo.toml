[package]
name = "evidence-collector"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[lints]
workspace = true

[[bin]]
name = "interdict-collector"
path = "src/main.rs"

[dependencies]
tonic = { version = "0.14", features = ["zstd", "tls-aws-lc", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
clickhouse = { version = "0.14", features = ["inserter", "lz4"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde", "zeroize"] }
rs_merkle = "1.5"
sha2 = "0.10"
aws-sdk-s3 = "1"
aws-sdk-kms = "1"
aws-config = "1"
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
arc-swap = "1"
async-trait = "0.1"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
interdict-verify = { path = "../interdict-verify" }
kernel = { path = "../kernel" }
tokio = { version = "1", features = ["full", "test-util"] }

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
