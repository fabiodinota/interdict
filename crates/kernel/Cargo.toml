[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47", features = ["full"] }
hyper = { version = "1.7", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto", "client-legacy", "service"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["timeout", "limit", "load-shed", "util"] }
tower-http = { version = "0.6", features = ["trace", "request-id"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
tokio-rustls = "0.26"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
arc-swap = "1.7"
dashmap = "6"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "0.26"
futures-util = "0.3"
http = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
regorus = { version = "0.9.1", default-features = false, features = ["arc", "regex", "glob", "semver", "time", "uuid", "std"] }
wasmtime = { version = "42", features = ["pooling-allocator", "cranelift", "runtime"] }
tract-onnx = "0.22.1"
rusqlite = { version = "0.38", features = ["bundled"] }
regex = "1"
sha2 = "0.10"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tonic = { version = "0.14", features = ["zstd", "tls-aws-lc", "tls-native-roots"] }
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"
zstd = "0.13"
tokio-stream = "0.1"
tokio-util = "0.7"
rand = "0.9"

[dependencies.tikv-jemallocator]
version = "0.6"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3"
tokio-stream = "0.1"
wat = "1"

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"

[[bench]]
name = "proxy_latency"
harness = false


[[bench]]
name = "pattern_matching"
harness = false
