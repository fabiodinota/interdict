# Grafana dashboard provisioning — loads dashboards from /var/lib/grafana/dashboards
apiVersion: 1

providers:
  - name: Interdict
    orgId: 1
    folder: Interdict
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
