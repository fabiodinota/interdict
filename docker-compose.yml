# Interdict AI Governance Platform - Docker Compose
# Usage: cp env.example .env && docker compose up
#
# Exposes:
#   - Kernel proxy: https://localhost:8443
#   - Control plane API: http://localhost:3001
#   - Dashboard: http://localhost:8080

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:17-bookworm
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interdict}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — generate with openssl rand -base64 32}"
      POSTGRES_DB: ${POSTGRES_DB:-interdict}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interdict} -d ${POSTGRES_DB:-interdict}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - data

  clickhouse:
    image: clickhouse/clickhouse-server:25.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env — generate with openssl rand -base64 32}"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - data

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-interdict}
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env — generate with openssl rand -base64 32}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - data

  # One-shot init container to create the evidence bucket in MinIO
  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/interdict-evidence &&
      echo 'Bucket interdict-evidence ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-interdict}
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
    restart: "no"
    networks:
      - data

  # ---------------------------------------------------------------------------
  # mTLS Certificate Bootstrap
  # ---------------------------------------------------------------------------

  cert-init:
    image: alpine:3.21
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache openssl &&
        sh /scripts/generate-internal-ca.sh
    volumes:
      - ./docker/certs/generate-internal-ca.sh:/scripts/generate-internal-ca.sh:ro
      - certs:/certs
    restart: "no"

  # ---------------------------------------------------------------------------
  # Interdict Services
  # ---------------------------------------------------------------------------

  control-plane:
    build:
      context: .
      dockerfile: docker/control-plane/Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      cert-init:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128M
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env — must contain postgres connection string with password}"
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-interdict}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}"
      PORT: ${PORT:-3000}
      WASM_STORAGE_DIR: ${WASM_STORAGE_DIR:-./data/wasm}
      OPA_BINARY_PATH: ${OPA_BINARY_PATH:-opa}
      INTERDICT_GRPC_PORT: ${INTERDICT_GRPC_PORT:-50052}
      MTLS_ENABLED: ${MTLS_ENABLED:-true}
      MTLS_CA_CERT_PATH: ${MTLS_CA_CERT_PATH:-/certs/internal-ca.pem}
      MTLS_CERT_PATH: ${MTLS_CERT_PATH:-/certs/control-plane.pem}
      MTLS_KEY_PATH: ${MTLS_KEY_PATH:-/certs/control-plane-key.pem}
      SAML_SP_ENTITY_ID: ${SAML_SP_ENTITY_ID:-http://localhost:3001/api/v1/auth/saml/metadata}
      SAML_SP_BASE_URL: ${SAML_SP_BASE_URL:-http://localhost:3001}
      SAML_SP_KEY_PATH: ${SAML_SP_KEY_PATH:-/certs/saml-sp.key}
      SAML_SP_CERT_PATH: ${SAML_SP_CERT_PATH:-/certs/saml-sp.crt}
      SAML_IDP_METADATA_PATH: ${SAML_IDP_METADATA_PATH:-/config/idp-metadata.xml}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:8080}
      SIGNING_KEY_OUTPUT_PATH: ${SIGNING_KEY_OUTPUT_PATH:-/data/keys/signing.key}
    ports:
      - "3001:3000"
    volumes:
      - certs:/certs:ro
      - signing_keys:/data/keys:ro
      - ./config:/config:ro
      - wasm_data:/app/data/wasm
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    restart: unless-stopped
    networks:
      - backend
      - data

  evidence-collector:
    build:
      context: .
      dockerfile: docker/evidence-collector/Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      cert-init:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M
      - /data/dead-letter:size=64M
      - /data/anchors:size=64M
    environment:
      COLLECTOR_GRPC_LISTEN_ADDR: ${COLLECTOR_GRPC_LISTEN_ADDR:-[::]:50051}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-interdict}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}"
      COLLECTOR_S3_BUCKET: ${COLLECTOR_S3_BUCKET:-interdict-evidence}
      COLLECTOR_S3_REGION: ${COLLECTOR_S3_REGION:-us-east-1}
      COLLECTOR_SIGNING_MODE: ${COLLECTOR_SIGNING_MODE:-dev}
      COLLECTOR_SIGNING_KEY_PATH: ${COLLECTOR_SIGNING_KEY_PATH:-/data/keys/signing.key}
      SIGNING_KEY_WATCH_PATH: ${SIGNING_KEY_WATCH_PATH:-/data/keys/signing.key}
      COLLECTOR_MERKLE_WINDOW_SECS: ${COLLECTOR_MERKLE_WINDOW_SECS:-3600}
      COLLECTOR_MERKLE_MAX_LEAVES: ${COLLECTOR_MERKLE_MAX_LEAVES:-1000000}
      COLLECTOR_FULL_TEXT_STORAGE: ${COLLECTOR_FULL_TEXT_STORAGE:-false}
      COLLECTOR_RETENTION_DAYS: ${COLLECTOR_RETENTION_DAYS:-2555}
      COLLECTOR_REQUIRE_OBJECT_LOCK: ${COLLECTOR_REQUIRE_OBJECT_LOCK:-true}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env — must match MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env — must match MINIO_ROOT_PASSWORD}"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      MTLS_ENABLED: ${MTLS_ENABLED:-true}
      MTLS_CA_CERT_PATH: ${MTLS_CA_CERT_PATH:-/certs/internal-ca.pem}
      MTLS_CERT_PATH: ${MTLS_CERT_PATH:-/certs/evidence-collector.pem}
      MTLS_KEY_PATH: ${MTLS_KEY_PATH:-/certs/evidence-collector-key.pem}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - signing_keys:/data/keys:ro
      - certs:/certs:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - backend
      - data

  kernel:
    build:
      context: .
      dockerfile: docker/kernel/Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      control-plane:
        condition: service_healthy
      cert-init:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M
    environment:
      KERNEL_LISTEN_ADDR: ${KERNEL_LISTEN_ADDR:-0.0.0.0:8443}
      KERNEL_CONNECT_TIMEOUT_MS: ${KERNEL_CONNECT_TIMEOUT_MS:-10000}
      KERNEL_FIRST_BYTE_TIMEOUT_MS: ${KERNEL_FIRST_BYTE_TIMEOUT_MS:-30000}
      KERNEL_STREAM_TIMEOUT_MS: ${KERNEL_STREAM_TIMEOUT_MS:-300000}
      KERNEL_MAX_REQUEST_QUEUE: ${KERNEL_MAX_REQUEST_QUEUE:-1024}
      KERNEL_CA_CERT_PATH: ${KERNEL_CA_CERT_PATH:-/data/certs/ca.crt}
      KERNEL_CA_KEY_PATH: ${KERNEL_CA_KEY_PATH:-/data/certs/ca.key}
      KERNEL_POOL_MAX_CONNECTIONS: ${KERNEL_POOL_MAX_CONNECTIONS:-4}
      KERNEL_POOL_MAX_STREAMS: ${KERNEL_POOL_MAX_STREAMS:-100}
      KERNEL_POOL_IDLE_TIMEOUT: ${KERNEL_POOL_IDLE_TIMEOUT:-60000}
      KERNEL_REVIEW_DB_PATH: ${KERNEL_REVIEW_DB_PATH:-/data/review_queue.db}
      KERNEL_POLICIES_DIR: ${KERNEL_POLICIES_DIR:-/app/policies/}
      KERNEL_DISTRIBUTION_ADDR: ${KERNEL_DISTRIBUTION_ADDR:-https://control-plane:50052}
      KERNEL_DISTRIBUTION_TLS_SERVER_NAME: ${KERNEL_DISTRIBUTION_TLS_SERVER_NAME:-control-plane}
      KERNEL_EVIDENCE_COLLECTOR_ADDR: ${KERNEL_EVIDENCE_COLLECTOR_ADDR:-https://evidence-collector:50051}
      KERNEL_MTLS_CA_CERT: ${KERNEL_MTLS_CA_CERT:-/certs/internal-ca.pem}
      KERNEL_MTLS_CLIENT_CERT: ${KERNEL_MTLS_CLIENT_CERT:-/certs/kernel-client.pem}
      KERNEL_MTLS_CLIENT_KEY: ${KERNEL_MTLS_CLIENT_KEY:-/certs/kernel-client-key.pem}
      KERNEL_ORG_ID: ${KERNEL_ORG_ID:-default}
      KERNEL_LOG_LEVEL: ${KERNEL_LOG_LEVEL:-info}
      KERNEL_LOG_FORMAT: ${KERNEL_LOG_FORMAT:-json}
      KERNEL_ALLOWLIST_VENDORS: ${KERNEL_ALLOWLIST_VENDORS:-["api.openai.com","api.anthropic.com"]}
      KERNEL_FORCE_TEMPLATE: ${KERNEL_FORCE_TEMPLATE:-false}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8443:8443"
    volumes:
      - kernel_data:/data
      - kernel_policies:/app/policies
      - certs:/certs:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8443"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - backend
      - data

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_SAML_ENABLED: ${NEXT_PUBLIC_SAML_ENABLED:-false}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      control-plane:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M
    environment:
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://control-plane:3000}
      NODE_ENV: production
      NEXT_PUBLIC_SAML_ENABLED: ${NEXT_PUBLIC_SAML_ENABLED:-false}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "8080:3001"
    volumes:
      - dashboard_cache:/app/.next/cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - frontend
      - backend

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  minio_data:
    driver: local
  kernel_data:
    driver: local
  kernel_policies:
    driver: local
  signing_keys:
    driver: local
  certs:
    driver: local
  wasm_data:
    driver: local
  dashboard_cache:
    driver: local

# ---------------------------------------------------------------------------
# Networks — 3-tier segmentation
# ---------------------------------------------------------------------------
# frontend: browser-facing services (dashboard, grafana)
# backend:  inter-service communication (app services, prometheus)
# data:     database access (postgres, clickhouse, minio)
#
# dashboard  → frontend + backend  (no direct DB access)
# kernel     → backend  + data
# control-plane → backend + data
# evidence-collector → backend + data
# postgres/clickhouse/minio → data only

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge
