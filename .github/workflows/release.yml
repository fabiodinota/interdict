# Release pipeline: build, push, SBOM, sign, and publish GitHub Release
# Triggered on v* tag push (e.g. v1.0.0, v2.3.1-rc.1)
#
# Flow per service: build+push → SBOM → cosign sign (by digest, never tag)
# Signing uses keyless cosign via GitHub Actions OIDC — no secrets needed.

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write    # cosign OIDC keyless signing
  packages: write    # push to ghcr.io
  contents: write    # create GitHub Release
  attestations: write # SBOM attestations

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fabiodinota/interdict

jobs:
  # ---------------------------------------------------------------------------
  # Build, push, generate SBOM, and sign each service image
  # ---------------------------------------------------------------------------
  release:
    name: Build, Sign & Release
    runs-on: ubuntu-latest

    steps:
      # ── Shared setup ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      # ── Kernel ─────────────────────────────────────────────────────────────
      - name: Build and push kernel
        id: build-kernel
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: docker/kernel/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}/kernel:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/kernel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM for kernel
        uses: anchore/sbom-action@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a # v0.9.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/kernel@${{ steps.build-kernel.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-kernel.spdx.json
          output-file: sbom-kernel.spdx.json

      - name: Sign kernel image
        run: cosign sign --yes "${{ env.IMAGE_PREFIX }}/kernel@${{ steps.build-kernel.outputs.digest }}"

      # ── Control Plane ──────────────────────────────────────────────────────
      - name: Build and push control-plane
        id: build-control-plane
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: docker/control-plane/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}/control-plane:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/control-plane:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM for control-plane
        uses: anchore/sbom-action@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a # v0.9.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/control-plane@${{ steps.build-control-plane.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-control-plane.spdx.json
          output-file: sbom-control-plane.spdx.json

      - name: Sign control-plane image
        run: cosign sign --yes "${{ env.IMAGE_PREFIX }}/control-plane@${{ steps.build-control-plane.outputs.digest }}"

      # ── Dashboard ──────────────────────────────────────────────────────────
      - name: Build and push dashboard
        id: build-dashboard
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: docker/dashboard/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}/dashboard:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM for dashboard
        uses: anchore/sbom-action@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a # v0.9.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/dashboard@${{ steps.build-dashboard.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-dashboard.spdx.json
          output-file: sbom-dashboard.spdx.json

      - name: Sign dashboard image
        run: cosign sign --yes "${{ env.IMAGE_PREFIX }}/dashboard@${{ steps.build-dashboard.outputs.digest }}"

      # ── Evidence Collector ─────────────────────────────────────────────────
      - name: Build and push evidence-collector
        id: build-evidence-collector
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: docker/evidence-collector/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}/evidence-collector:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/evidence-collector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM for evidence-collector
        uses: anchore/sbom-action@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a # v0.9.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/evidence-collector@${{ steps.build-evidence-collector.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-evidence-collector.spdx.json
          output-file: sbom-evidence-collector.spdx.json

      - name: Sign evidence-collector image
        run: cosign sign --yes "${{ env.IMAGE_PREFIX }}/evidence-collector@${{ steps.build-evidence-collector.outputs.digest }}"

      # ── GitHub Release ─────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@26e8ad27a09a225049a7075d7ec1caa2df6ff332 # v2.6.0
        with:
          generate_release_notes: true
          files: |
            sbom-kernel.spdx.json
            sbom-control-plane.spdx.json
            sbom-dashboard.spdx.json
            sbom-evidence-collector.spdx.json

      # ── Failure diagnostics ───────────────────────────────────────────
      - name: Surface release failure diagnostics
        if: failure()
        run: |
          echo "::error::Release pipeline failed. Check the logs above for the failing step."
          echo "## Release Failure Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "One or more steps in the release pipeline failed." >> "$GITHUB_STEP_SUMMARY"
          echo "Check the workflow run logs for details on which service build, SBOM generation, or signing step failed." >> "$GITHUB_STEP_SUMMARY"
