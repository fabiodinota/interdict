name: ci-quality-security

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.deployment_mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment_mode: [vpc-native, sidecar, air-gapped]
    env:
      INTERDICT_DEPLOYMENT_MODE: ${{ matrix.deployment_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (evidence-collector, serialized)
        run: cargo test -p evidence-collector --all-targets -- --test-threads=1

      - name: Tests (remaining crates)
        run: cargo test --workspace --all-targets --exclude evidence-collector

      - name: Content inspection integration gate
        run: cargo test -p kernel --test content_inspection_test

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny (if configured)
        run: |
          if [ -f deny.toml ]; then
            cargo install cargo-deny --locked
            cargo deny check
          else
            echo "Skipping cargo deny (deny.toml not present)"
          fi

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # Phase 17: Control-Plane TypeScript quality gate
  # ---------------------------------------------------------------------------
  control-plane:
    name: control-plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test

  # ---------------------------------------------------------------------------
  # Phase 17: Dashboard build + lint gate
  # Phase 22: Dashboard test gate
  # ---------------------------------------------------------------------------
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
