name: ci-quality-security

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  infra-quality:
    name: infra-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          python3 -m pip install --user yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install hadolint
        run: |
          HADOLINT_VERSION=v2.12.0
          curl -fsSL "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64" -o hadolint
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/hadolint

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.50.0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.1

      - name: Run infra quality gate
        run: npm run lint:infra

  quality:
    name: quality (${{ matrix.deployment_mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment_mode: [vpc-native, sidecar, air-gapped]
    env:
      INTERDICT_DEPLOYMENT_MODE: ${{ matrix.deployment_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (evidence-collector, serialized)
        run: cargo test -p evidence-collector --all-targets -- --test-threads=1

      - name: Tests (remaining crates)
        run: cargo test --workspace --all-targets --exclude evidence-collector

      - name: Content inspection integration gate
        run: cargo test -p kernel --test content_inspection_test

  # ---------------------------------------------------------------------------
  # Code coverage reporting (hard gate — blocks pipeline on failure)
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: false

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # Phase 17: Control-Plane TypeScript quality gate
  # ---------------------------------------------------------------------------
  control-plane:
    name: control-plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint + format check
        run: npx @biomejs/biome check ./src

      - name: Type check
        run: bunx tsc --noEmit

      - name: Tests with coverage
        run: bun test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: control-plane
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Phase 17: Dashboard build + lint gate
  # Phase 22: Dashboard test gate
  # ---------------------------------------------------------------------------
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check 'src/**/*.{ts,tsx,js,jsx,json,css}'

      - name: Lint
        run: npx eslint

      - name: Tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: dashboard
          fail_ci_if_error: false

      - name: Build
        run: npm run build
