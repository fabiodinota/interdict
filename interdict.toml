# interdict.toml -- Interdict Kernel Proxy Configuration
#
# This is the main configuration file for the Interdict AI governance proxy.
# All sections are required unless defaults are acceptable.

[proxy]
# Address and port to listen on for incoming proxy connections.
listen_addr = "0.0.0.0:8443"

# Timeouts are generous by default for AI workloads where
# streaming responses (SSE, gRPC) can last several minutes.
connect_timeout_ms = 10_000       # 10s to establish upstream connection
first_byte_timeout_ms = 30_000    # 30s to receive first byte from AI vendor
stream_timeout_ms = 300_000       # 5min for streaming responses (SSE, gRPC)

# Backpressure: return 503 Service Unavailable when queue exceeds this limit.
max_request_queue = 1024

[tls]
# Deployment-unique CA certificate and key used for TLS interception.
# The CA must be installed on client machines for HTTPS inspection to work.
ca_cert_path = "./ca.crt"
ca_key_path = "./ca.key"

[pool]
# HTTP/2 connection pool settings per vendor backend.
# Multiple connections avoid single-connection stream saturation (KERN-12).
max_connections_per_vendor = 4      # TCP connections per vendor
max_streams_per_connection = 100    # Concurrent HTTP/2 streams per connection
idle_timeout_ms = 60_000            # Close idle connections after 60s

[allowlist]
# Deny-by-default vendor allowlist.
# Only these domains can be reached through the proxy.
# All other domains are blocked with 403 Forbidden.
vendors = [
    "api.openai.com",
    "api.anthropic.com",
    "api.cohere.ai",
    "generativelanguage.googleapis.com",
]

[logging]
# Log level: debug, info, warn, error
# Can be overridden via RUST_LOG environment variable.
level = "info"

# Output format: "json" for production (container-friendly), "pretty" for development.
format = "json"

[policy]
# Policy engine configuration for the 3-layer evaluation pipeline.

# Number of pre-created Regorus engine instances in the pool.
# Each instance has policies pre-loaded for fast evaluation.
# regorus_pool_size = 8

# Maximum concurrent Wasmtime instances (pooling allocator slots).
# Each slot is pre-allocated for fast Wasm module instantiation.
# wasm_max_instances = 64

# Maximum linear memory per Wasm instance in bytes.
# Policy modules are small; 1MB is generous. Keeps total memory bounded.
# wasm_max_memory_bytes = 1048576  # 1MB

# Number of background worker threads for Layer 2 NLP classification.
# Background L2 runs after Layer 1 gives an explicit verdict, for analytics.
# l2_background_workers = 2

# Maximum queued Layer 2 background classification jobs.
# Jobs beyond this limit are dropped (background L2 is best-effort).
# l2_queue_depth = 256

# Maximum pending Layer 3 human reviews before applying fail-mode.
# Prevents connection exhaustion from too many held connections.
# l3_max_pending_reviews = 50

# Layer 3 review timeout in seconds. If no human decides within this
# time, the policy's fail-mode (fail-closed/fail-open) applies.
# l3_timeout_seconds = 30

# Path to the SQLite database for human review queue persistence.
# review_db_path = "data/review_queue.db"

# Directory containing Rego policy source files.
# policies_dir = "policies/"

# Optional path to the ONNX model for Layer 2 NLP classification.
# If not set, Layer 2 classification is disabled.
# l2_model_path = "models/classifier.onnx"
