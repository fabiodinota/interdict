# Interdict Monitoring Profile — Prometheus + Grafana
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml --profile monitoring up
#
# Ports:
#   - Prometheus: http://localhost:9090
#   - Grafana:    http://localhost:3002 (credentials from .env)

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [monitoring]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.5.2
    profiles: [monitoring]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env — generate with openssl rand -base64 32}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - frontend
      - backend

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Networks are defined in docker-compose.yml (primary file).
# When merging with -f, Docker Compose inherits them automatically.
